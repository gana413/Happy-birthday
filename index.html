<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIZONYX - Digital Raksha Bandhan Vision</title>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .mirror-mode {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 relative select-none">

    <!-- Header Section -->
    <div class="absolute top-4 z-20 text-center">
        <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-yellow-400 to-orange-500 tracking-wider">
            రక్షాబంధన్ డిజిటల్ విజన్
        </h1>
        <p class="text-xs md:text-sm text-gray-300 mt-1" id="status-text">
            కెమెరా ఆన్ చేసి చేతిని చూపించండి...
        </p>
    </div>

    <!-- Video & Canvas Container -->
    <div class="relative w-full max-w-4xl h-[70vh] bg-gray-900 rounded-3xl overflow-hidden shadow-2xl border border-yellow-500/30 flex items-center justify-center">
        <!-- Raw Video Stream -->
        <video id="webcam" class="absolute w-full h-full object-cover mirror-mode" playsinline autoplay muted></video>
        <!-- AR Tracking Canvas -->
        <canvas id="output_canvas" class="absolute w-full h-full object-cover mirror-mode z-10"></canvas>

        <!-- Dynamic Overlay Message -->
        <div id="wishes-card" class="hidden absolute z-30 flex-col items-center justify-center bg-black/75 backdrop-blur-md p-6 rounded-2xl border-2 border-yellow-400 max-w-md text-center transform scale-90 transition-all duration-300">
            <div class="text-5xl mb-2">✨ 🪢 ✨</div>
            <h2 class="text-2xl font-bold text-yellow-400 mb-2">రక్షాబంధన్ శుభాకాంక్షలు!</h2>
            <p class="text-gray-200 text-sm" id="custom-greeting-text">
                సోదర సోదరీమణుల అనురాగానికి ప్రతీకగా డిజిటల్ రాఖీ విజయవంతంగా కట్టబడింది!
            </p>
            <button onclick="resetTieProcess()" class="mt-4 px-6 py-2 bg-gradient-to-r from-orange-500 to-red-600 rounded-full font-semibold text-white shadow-lg hover:brightness-110 active:scale-95 transition-all">
                మళ్ళీ కట్టండి
            </button>
        </div>
    </div>

    <!-- Bottom Controls & Instructions -->
    <div class="mt-4 z-20 flex flex-col md:flex-row items-center gap-4 bg-gray-800/80 px-6 py-3 rounded-2xl border border-gray-700">
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-yellow-400 animate-ping"></span>
            <span class="text-xs text-gray-300 font-medium">హ్యాండ్ పోజ్: చూపుడు వేలు & బొటనవేలిని రాఖీ దగ్గరకు తెచ్చి కట్టండి (Pinch Gesture)</span>
        </div>
        <div class="flex gap-2">
            <button id="start-btn" onclick="initCameraStream()" class="px-4 py-2 bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold text-xs rounded-xl shadow-md transition-all">
                కెమెరా ప్రారంభించండి
            </button>
        </div>
    </div>

    <script>
        /**
         * FIZONYX AR Rakhi Core Engine
         */
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status-text');
        const wishesCard = document.getElementById('wishes-card');
        const startBtn = document.getElementById('start-btn');

        let isRakhiTied = false;
        let isProcessing = false;
        let audioContext = null;

        // Initialize Web Audio Synthesizer for Festive Chime
        function playCelebrationSound() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, index) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioContext.currentTime + index * 0.12);
                    gain.gain.setValueAtTime(0.3, audioContext.currentTime + index * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + index * 0.12 + 0.6);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.start(audioContext.currentTime + index * 0.12);
                    osc.stop(audioContext.currentTime + index * 0.12 + 0.6);
                });
            } catch (err) {
                console.error("Audio playback error:", err);
            }
        }

        // Draw Digital Rakhi
        function drawRakhi(ctx, x, y, scale = 1.0, isTied = false) {
            ctx.save();
            ctx.translate(x, y);

            // Silk Thread (Dhaaga)
            ctx.beginPath();
            ctx.moveTo(-150 * scale, 0);
            ctx.bezierCurveTo(-50 * scale, -15 * scale, 50 * scale, 15 * scale, 150 * scale, 0);
            ctx.lineWidth = 6 * scale;
            ctx.strokeStyle = '#dc2626'; // Red thread
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-150 * scale, 0);
            ctx.bezierCurveTo(-50 * scale, 15 * scale, 50 * scale, -15 * scale, 150 * scale, 0);
            ctx.lineWidth = 3 * scale;
            ctx.strokeStyle = '#facc15'; // Golden yellow sub-thread
            ctx.stroke();

            // Center Ornament (Base Ring)
            ctx.beginPath();
            ctx.arc(0, 0, 32 * scale, 0, 2 * Math.PI);
            ctx.fillStyle = '#b91c1c';
            ctx.fill();
            ctx.lineWidth = 3 * scale;
            ctx.strokeStyle = '#fef08a';
            ctx.stroke();

            // Decorative Floral Petals
            const petalCount = 8;
            for (let i = 0; i < petalCount; i++) {
                const angle = (i * 2 * Math.PI) / petalCount;
                const px = Math.cos(angle) * (26 * scale);
                const py = Math.sin(angle) * (26 * scale);

                ctx.beginPath();
                ctx.arc(px, py, 9 * scale, 0, 2 * Math.PI);
                ctx.fillStyle = '#f59e0b';
                ctx.fill();
                ctx.lineWidth = 1.5 * scale;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            }

            // Center Sparkling Gem
            ctx.beginPath();
            ctx.arc(0, 0, 16 * scale, 0, 2 * Math.PI);
            ctx.fillStyle = isTied ? '#22c55e' : '#facc15';
            ctx.fill();
            ctx.lineWidth = 2 * scale;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // Center Icon Symbol (Om / Swastik / Star effect)
            ctx.fillStyle = '#7f1d1d';
            ctx.font = `bold ${12 * scale}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("卐", 0, 0);

            ctx.restore();
        }

        // Trigger Rakhi Celebration Event
        function triggerRakhiCelebration() {
            isRakhiTied = true;
            statusText.innerText = "రాఖీ విజయవంతంగా కట్టబడింది! 🎉";
            wishesCard.classList.remove('hidden');
            wishesCard.classList.add('flex');

            playCelebrationSound();

            // Confetti Explosion
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function resetTieProcess() {
            isRakhiTied = false;
            wishesCard.classList.add('hidden');
            wishesCard.classList.remove('flex');
            statusText.innerText = "కెమెరాలో మీ చేతిని చూపించండి...";
        }

        // Process MediaPipe Detection Landmarks
        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Tracking Primary Hand for Wrist Position
                const primaryHand = results.multiHandLandmarks[0];
                const wrist = primaryHand[0];
                const indexFingerTip = primaryHand[8];
                const thumbTip = primaryHand[4];

                const wristX = wrist.x * canvasElement.width;
                const wristY = wrist.y * canvasElement.height;

                // Check distance between index tip and thumb (Pinch Gesture)
                const pinchDist = Math.hypot(
                    (indexFingerTip.x - thumbTip.x) * canvasElement.width,
                    (indexFingerTip.y - thumbTip.y) * canvasElement.height
                );

                // Distance from pinch center to wrist
                const pinchCenterX = ((indexFingerTip.x + thumbTip.x) / 2) * canvasElement.width;
                const pinchCenterY = ((indexFingerTip.y + thumbTip.y) / 2) * canvasElement.height;
                const distToWrist = Math.hypot(pinchCenterX - wristX, pinchCenterY - wristY);

                // If pinch is made close to wrist, tie the Rakhi
                if (pinchDist < 45 && distToWrist < 120 && !isRakhiTied) {
                    triggerRakhiCelebration();
                }

                // Render Rakhi on Wrist
                drawRakhi(canvasCtx, wristX, wristY, 1.1, isRakhiTied);

                // Secondary feedback helper
                if (!isRakhiTied) {
                    statusText.innerText = "చూపుడు వేలు & బొటనవేలిని రాఖీ దగ్గరకు తెచ్చి కట్టే సైగ చేయండి.";
                }
            } else if (!isRakhiTied) {
                statusText.innerText = "చేతిని కెమెరా ముందు స్పష్టంగా ఉంచండి...";
            }

            canvasCtx.restore();
        }

        // Initialize MediaPipe Hands Solution
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65
        });

        hands.onResults(onResults);

        // Webcam Stream Initializer
        async function initCameraStream() {
            if (isProcessing) return;
            startBtn.innerText = "కెమెరా లోడ్ అవుతోంది...";
            startBtn.disabled = true;

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 1280,
                height: 720
            });

            await camera.start();
            isProcessing = true;
            startBtn.innerText = "కెమెరా ఆన్‌లో ఉంది";
            startBtn.classList.add('bg-green-600', 'text-white');
        }
    </script>
</body>
</html>
